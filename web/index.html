<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ScamShield - ask Cyber</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F0FF; --card:#fff; --ink:#15173F; --muted:#575B88; --line:#DAD9FA;
  --brand:#4B3DFF; --brand-dark:#3427D6; --pink:#FF4FA3; --cyan:#19D3F3; --sun:#FFC93C; --mint:#2BD9A0;
  --danger:#E5383B; --caution:#F5A300; --safe:#13A25A; --promo:#0098C4; --neutral:#6B6F99;
  --v:var(--neutral); --v2:#9A8CFF;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Hind Siliguri",system-ui,sans-serif;font-size:18px;line-height:1.55;overflow-x:hidden}
h1,h2,.display{font-family:"Bricolage Grotesque","Hind Siliguri",sans-serif;font-weight:800;letter-spacing:-.02em;line-height:1.05;margin:0}
.wrap{max-width:940px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:6px}

/* drifting colour blobs behind everything */
.blobs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;width:46vmax;height:46vmax;border-radius:50%;filter:blur(80px);opacity:.5;animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){background:var(--pink);left:-12vmax;top:-10vmax}
.blobs i:nth-child(2){background:var(--cyan);right:-14vmax;top:8vmax;animation-delay:-7s}
.blobs i:nth-child(3){background:var(--sun);left:12vmax;bottom:-22vmax;animation-delay:-13s;opacity:.4}
.blobs i:nth-child(4){background:var(--brand);right:4vmax;bottom:-18vmax;animation-delay:-3s;opacity:.35}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.18)}}
.tint{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .8s;background:radial-gradient(70% 60% at 50% 30%,var(--v),transparent 70%)}
body.has-verdict .tint{opacity:.28}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:50;pointer-events:none}
.flash{position:fixed;inset:0;z-index:40;pointer-events:none;background:var(--danger);opacity:0}
.flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.45}100%{opacity:0}}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
.brand{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:22px}
.seg{display:inline-flex;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px}
.seg button{border:0;background:none;font:inherit;font-size:15px;font-weight:600;padding:5px 14px;border-radius:999px;cursor:pointer;color:var(--ink);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;padding:14px 0 30px}
.hero h1{font-size:clamp(38px,7vw,70px);background:linear-gradient(100deg,var(--ink) 0%,var(--brand) 40%,var(--pink) 75%,var(--ink) 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:ink 9s ease-in-out infinite alternate;padding-bottom:.08em}
@keyframes ink{to{background-position:100% 0}}
.hero p{max-width:34em;color:var(--muted);margin:14px 0 0}
.cyber-col{display:flex;flex-direction:column;align-items:center;gap:8px;width:clamp(150px,24vw,220px)}
.mascot-btn{background:none;border:0;padding:0;cursor:pointer;width:100%}
.mascot{width:100%;height:auto;display:block;overflow:visible}
.mascot .shell{fill:var(--brand)}
.mascot .bulb{fill:var(--sun);transition:fill .3s}
.mascot .m{display:none}
.mascot[data-mood="idle"] .m-idle,.mascot[data-mood="happy"] .m-happy,.mascot[data-mood="alarm"] .m-alarm,.mascot[data-mood="worry"] .m-worry,.mascot[data-mood="hmm"] .m-hmm,.mascot[data-mood="scan"] .m-hmm{display:inline}
.mascot .blink{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.mascot[data-mood="scan"] .dart{animation:dart .45s ease-in-out infinite alternate}
@keyframes dart{from{transform:translateX(-7px)}to{transform:translateX(7px)}}
.mascot[data-mood="scan"] .bulb{animation:pulse .35s infinite alternate;fill:var(--cyan)}
@keyframes pulse{to{opacity:.3}}
.mascot[data-mood="alarm"] .bulb{fill:var(--danger);animation:pulse .25s infinite alternate}
.mascot[data-mood="worry"] .bulb{fill:var(--caution)}
.mascot[data-mood="happy"] .bulb{fill:var(--mint)}
.mascot.act{animation:hop .6s}
.mascot[data-mood="alarm"].act{animation:shake .5s}
@keyframes hop{30%{transform:translateY(-16px) rotate(-3deg)}60%{transform:translateY(0) rotate(2deg)}}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.tip{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:15px;line-height:1.35;min-height:3.1em;width:100%;text-align:center;box-shadow:3px 3px 0 var(--ink)}
.tip.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}}
@media(max-width:600px){.hero{grid-template-columns:1fr}.cyber-col{order:-1;width:150px;margin:0 auto}}

/* checker */
.checker{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:18px;box-shadow:6px 6px 0 var(--ink)}
.checker label.big{display:block;font-weight:700;margin-bottom:8px}
.field{position:relative;border-radius:12px;overflow:hidden}
textarea{width:100%;min-height:150px;resize:vertical;border:2px solid var(--line);border-radius:12px;padding:14px;font:inherit;color:var(--ink);background:#FAFAFF;display:block}
textarea:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 4px #4b3dff29}
.field.scanning textarea{border-color:var(--cyan)}
.beam{position:absolute;left:0;right:0;top:0;height:56px;pointer-events:none;opacity:0;background:linear-gradient(180deg,transparent,#19d3f355 60%,#19d3f3cc 98%,var(--cyan) 100%);border-bottom:3px solid var(--cyan)}
.field.scanning .beam{opacity:1;animation:sweep 1.1s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(-56px)}to{transform:translateY(var(--h,150px))}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.chips span.t{color:var(--muted);font-size:15px}
.chip{border:2px solid var(--c,var(--line));background:#fff;border-radius:999px;padding:3px 12px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink);transition:transform .15s,background .15s}
.chip:hover{background:var(--c);color:#fff;transform:translateY(-2px) rotate(-1deg)}
.chip:nth-of-type(1){--c:var(--pink)}.chip:nth-of-type(2){--c:var(--promo)}.chip:nth-of-type(3){--c:var(--safe)}
.deep{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:15px;color:var(--muted)}
.deep input{width:20px;height:20px;margin-top:3px;accent-color:var(--brand)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.go{margin-left:auto;background:linear-gradient(100deg,var(--brand),#7A4DFF 60%,var(--pink));color:#fff;border:0;border-radius:14px;font:inherit;font-weight:700;font-size:19px;padding:12px 28px;cursor:pointer;box-shadow:0 4px 0 var(--brand-dark);transition:transform .15s,filter .15s}
.go:hover{filter:brightness(1.1);transform:translateY(-2px)}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-dark)}
.go[disabled]{opacity:.7;cursor:wait}
.ghost{background:none;border:0;font:inherit;font-size:15px;color:var(--muted);text-decoration:underline;cursor:pointer}
.error{color:var(--danger);font-weight:600;margin-top:10px}

/* result */
#result{margin:30px 0 8px}
.verdict{background:linear-gradient(120deg,var(--v),var(--v2));color:#fff;border:2px solid var(--ink);border-radius:20px;padding:22px;display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center;box-shadow:6px 6px 0 var(--ink)}
.verdict.light{color:var(--ink)}
.verdict.shake{animation:shake .55s}
.stamp{width:96px;height:96px;border-radius:50%;border:5px solid currentColor;display:grid;place-items:center;transform:rotate(-8deg)}
.stamp svg{width:52px;height:52px}
.verdict h2{font-size:clamp(28px,5vw,46px)}
.stamp.land{animation:land .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.gauge{width:190px;text-align:center}
.gauge svg{width:100%;display:block}
.needle{transform-origin:100px 100px;transform:rotate(-90deg);transition:transform 1.3s cubic-bezier(.3,1.5,.5,1)}
.gauge .pct{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:30px;line-height:1;margin-top:-4px}
.gauge .cap{font-size:14px;opacity:.9}
@media(max-width:640px){.verdict{grid-template-columns:auto 1fr}.gauge{grid-column:1/-1;margin:0 auto}}
.cyber{display:grid;grid-template-columns:70px 1fr;gap:14px;margin-top:20px;align-items:start}
.cyber .mascot{width:70px}
.bubble{background:#fff;border:2px solid var(--ink);border-radius:6px 18px 18px 18px;padding:14px 16px;min-height:60px}
.bubble p{margin:0 0 8px}
.listen{background:var(--ink);color:#fff;border:0;border-radius:999px;font:inherit;font-weight:600;font-size:16px;padding:7px 16px;cursor:pointer;margin-top:4px}
.listen:hover{background:var(--brand)}
.note{font-size:14px;color:var(--muted);margin-top:8px}
details{background:#fff;border:2px solid var(--line);border-radius:14px;margin-top:12px;padding:0 16px}
summary{cursor:pointer;font-weight:700;padding:12px 0}
details[open]{padding-bottom:12px}
.marked{font-size:19px;line-height:2}
.marked mark{border-radius:8px;padding:1px 6px;color:inherit;background:none;transition:transform .15s}
.marked mark:hover{transform:scale(1.12)}
.marked .hot{background:#FFD0D2;box-shadow:inset 0 -3px 0 var(--danger)}
.marked .cool{background:#CDF3DF;box-shadow:inset 0 -3px 0 var(--safe)}
.marked .risky{background:var(--danger);color:#fff}
.marked .check{background:var(--caution)}
.marked .ok{background:#CDF3DF}
.legend{font-size:14px;color:var(--muted);margin-top:6px}
.link{border-left:6px solid var(--neutral);padding:6px 12px;margin:10px 0;background:#F6F6FF;border-radius:0 10px 10px 0}
.link.ok{border-color:var(--safe)}.link.check{border-color:var(--caution)}.link.risky{border-color:var(--danger)}
.link b{word-break:break-all}
.link ul{margin:6px 0 0;padding-left:20px;font-size:16px}
.bar{display:grid;grid-template-columns:110px 1fr 50px;gap:10px;align-items:center;margin:8px 0;font-size:16px}
.bar i{display:block;height:14px;border-radius:7px;background:var(--line);overflow:hidden}
.bar i b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--pink));transition:width 1s cubic-bezier(.2,.9,.3,1)}
footer{margin:36px 0 0;padding-bottom:170px;font-size:14px;color:var(--muted)}

/* ===== Cyber the roaming character ===== */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.roambtn{border:2px solid var(--ink);background:#fff;border-radius:999px;font:inherit;font-size:15px;font-weight:600;padding:5px 14px;cursor:pointer;color:var(--ink)}
.roambtn[aria-pressed="true"]{background:var(--mint)}
.rover-wrap{position:fixed;top:0;left:0;width:clamp(84px,13vw,130px);z-index:30;pointer-events:none;will-change:transform}
.rover-wrap[hidden]{display:none}
.rover-wrap .rover{pointer-events:auto;cursor:pointer;width:100%}
.jumper.jump{animation:jumpy .6s cubic-bezier(.3,.7,.4,1)}
@keyframes jumpy{45%{transform:translateY(-70px)}}
.say{display:none;position:absolute;left:50%;top:-6px;margin-left:-16px;font-size:26px;line-height:1;pointer-events:none}
.say.pop{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.rover{--a:0deg;--b:0deg;--k:0deg;--d:.7s;--lean:0deg;--bh:0px}
.rover [class^="th"],.rover [class^="sh"],.rover [class^="up"],.rover [class^="fore"],.rover .fig{transition:none}
.rover .thL{transform-origin:68px 120px}.rover .thR{transform-origin:92px 120px}
.rover .shL{transform-origin:68px 150px}.rover .shR{transform-origin:92px 150px}
.rover .upL{transform-origin:44px 84px}.rover .upR{transform-origin:116px 84px}
.rover .foreL{transform-origin:36px 106px}.rover .foreR{transform-origin:124px 106px}
.rover .fig{transform-origin:80px 182px;animation:breath 3s ease-in-out infinite}
.rover .p-ball{transform-origin:112px 182px}
.rover .p-can,.rover .p-mag,.rover .p-sign,.rover .p-ball,.rover .sg,.rover .closed{display:none}
@keyframes breath{50%{transform:scaleY(1.025)}}
@keyframes sw{0%,100%{transform:rotate(calc(var(--a) * -1))}50%{transform:rotate(var(--a))}}
@keyframes ar{0%,100%{transform:rotate(calc(var(--b) * -1))}50%{transform:rotate(var(--b))}}
@keyframes kn{0%,15%,100%{transform:rotate(4deg)}55%{transform:rotate(var(--k))}85%{transform:rotate(calc(var(--k) * .4))}}
@keyframes bobw{0%,50%,100%{transform:translateY(0) rotate(var(--lean))}25%,75%{transform:translateY(calc(var(--bh) * -1)) rotate(var(--lean))}}
/* walking and running */
.rover[data-act="walk"]{--a:26deg;--b:30deg;--k:55deg;--d:.7s;--bh:4px}
.rover[data-act="run"]{--a:50deg;--b:64deg;--k:90deg;--d:.4s;--bh:8px;--lean:9deg}
.rover[data-act="walk"] .thL,.rover[data-act="run"] .thL,.rover[data-act="walk"] .thR,.rover[data-act="run"] .thR{animation:sw var(--d) ease-in-out infinite}
.rover[data-act="walk"] .thR,.rover[data-act="run"] .thR{animation-delay:calc(var(--d) / -2)}
.rover[data-act="walk"] .shL,.rover[data-act="run"] .shL,.rover[data-act="walk"] .shR,.rover[data-act="run"] .shR{animation:kn var(--d) linear infinite}
.rover[data-act="walk"] .shR,.rover[data-act="run"] .shR{animation-delay:calc(var(--d) / -2)}
.rover[data-act="walk"] .upR,.rover[data-act="run"] .upR,.rover[data-act="walk"] .upL,.rover[data-act="run"] .upL{animation:ar var(--d) ease-in-out infinite}
.rover[data-act="walk"] .upL,.rover[data-act="run"] .upL{animation-delay:calc(var(--d) / -2)}
.rover[data-act="walk"] .foreL,.rover[data-act="walk"] .foreR{transform:rotate(-16deg)}
.rover[data-act="run"] .foreL,.rover[data-act="run"] .foreR{transform:rotate(-55deg)}
.rover[data-act="walk"] .fig,.rover[data-act="run"] .fig{animation:bobw calc(var(--d) / 1) linear infinite}
/* drinking a can of juice, with sunglasses */
.rover[data-act="drink"] .sg,.rover[data-act="drink"] .p-can{display:inline}
.rover[data-act="drink"] .upR{animation:dUp 5s ease-in-out infinite}
.rover[data-act="drink"] .foreR{animation:dFore 5s ease-in-out infinite}
.rover[data-act="drink"] .fig{animation:chill 5s ease-in-out infinite}
@keyframes dUp{0%,8%{transform:rotate(0)}22%,30%{transform:rotate(112deg)}34%{transform:rotate(104deg)}40%{transform:rotate(112deg)}46%{transform:rotate(104deg)}52%,78%{transform:rotate(112deg)}92%,100%{transform:rotate(0)}}
@keyframes dFore{0%,8%{transform:rotate(0)}22%,78%{transform:rotate(-58deg)}92%,100%{transform:rotate(0)}}
@keyframes chill{0%,100%{transform:rotate(0)}30%,70%{transform:rotate(-3deg)}}
/* keepy-uppy with a ball */
.rover[data-act="play"] .p-ball{display:inline;animation:spin .6s linear infinite}
.rover[data-act="play"] .ballY{animation:bounce .9s infinite}
@keyframes bounce{0%{transform:translateY(0);animation-timing-function:cubic-bezier(.2,.6,.4,1)}50%{transform:translateY(-120px);animation-timing-function:cubic-bezier(.6,0,.8,.4)}100%{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
.rover[data-act="play"] .thR{animation:kick .9s infinite}
.rover[data-act="play"] .shR{animation:kickk .9s infinite}
.rover[data-act="play"] .upL{transform:rotate(60deg)}
.rover[data-act="play"] .upR{transform:rotate(-60deg)}
.rover[data-act="play"] .fig{animation:lean .9s ease-in-out infinite}
@keyframes kick{0%,6%{transform:rotate(-55deg)}25%,100%{transform:rotate(8deg)}}
@keyframes kickk{0%,6%{transform:rotate(10deg)}25%,100%{transform:rotate(25deg)}}
@keyframes lean{0%,6%{transform:rotate(-4deg)}30%,100%{transform:rotate(0)}}
/* dancing */
.rover[data-act="dance"] .fig{animation:sway .5s ease-in-out infinite alternate}
.rover[data-act="dance"] .upL{animation:dl .5s ease-in-out infinite alternate}
.rover[data-act="dance"] .upR{animation:dr .5s ease-in-out infinite alternate}
.rover[data-act="dance"] .thL{animation:dth .5s ease-in-out infinite alternate}
.rover[data-act="dance"] .thR{animation:dth .5s ease-in-out infinite alternate-reverse}
@keyframes sway{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-7px) rotate(6deg)}}
@keyframes dl{from{transform:rotate(40deg)}to{transform:rotate(165deg)}}
@keyframes dr{from{transform:rotate(-165deg)}to{transform:rotate(-40deg)}}
@keyframes dth{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
/* napping on his feet */
.rover[data-act="nap"] .pupils{display:none}
.rover[data-act="nap"] .closed{display:inline}
.rover[data-act="nap"] .fig{animation:nod 3s ease-in-out infinite}
@keyframes nod{0%,100%{transform:rotate(7deg)}50%{transform:rotate(12deg)}}
/* waving */
.rover[data-act="wave"] .upL{animation:wUp 2.9s ease-in-out infinite}
.rover[data-act="wave"] .foreL{animation:wv .35s ease-in-out infinite alternate}
@keyframes wUp{0%{transform:rotate(0)}15%,85%{transform:rotate(150deg)}100%{transform:rotate(0)}}
@keyframes wv{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
/* looking for scams with a magnifying glass */
.rover[data-act="search"] .p-mag{display:inline}
.rover[data-act="search"] .upR{animation:sUp .5s ease-in-out infinite alternate}
.rover[data-act="search"] .foreR{transform:rotate(-8deg)}
.rover[data-act="search"] .fig{animation:hopS .5s ease-in-out infinite alternate}
@keyframes sUp{from{transform:rotate(-78deg)}to{transform:rotate(-100deg)}}
@keyframes hopS{from{transform:translateY(0)}to{transform:translateY(-6px)}}
/* scam alarm: stop sign held high, jumping */
.rover[data-act="alert"] .p-sign{display:inline}
.rover[data-act="alert"] .upR{transform:rotate(-168deg)}
.rover[data-act="alert"] .upL{transform:rotate(168deg)}
.rover[data-act="alert"] .fig{animation:alertJ .35s ease-in-out infinite alternate}
@keyframes alertJ{from{transform:translateY(0)}to{transform:translateY(-16px)}}
/* careful: hand up like "wait" */
.rover[data-act="careful"] .upR{animation:cUp 1s ease-in-out infinite alternate}
@keyframes cUp{from{transform:rotate(-150deg)}to{transform:rotate(-160deg)}}
.rover[data-act="careful"] .fig{animation:chill 1.4s ease-in-out infinite}
/* cheering */
.rover[data-act="cheer"] .upL{transform:rotate(165deg)}
.rover[data-act="cheer"] .upR{transform:rotate(-165deg)}
.rover[data-act="cheer"] .shL,.rover[data-act="cheer"] .shR{transform:rotate(35deg)}
.rover[data-act="cheer"] .fig{animation:jump .6s ease-in-out infinite}
@keyframes jump{0%,100%{transform:translateY(0) scaleY(.94)}50%{transform:translateY(-30px) scaleY(1.03)}}
.rover[data-act="shrug"] .fig{animation:tilt 1.2s ease-in-out infinite alternate}
@keyframes tilt{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}


/* ===== more activities ===== */
.fx{position:fixed;left:0;top:0;z-index:31;pointer-events:none;font-size:26px;line-height:1}
.fx[hidden]{display:none}
#fball.roll{animation:spin .5s linear infinite}
#fdisc{animation:disc .35s linear infinite}
@keyframes disc{from{transform:rotate(0) scaleY(.55)}to{transform:rotate(360deg) scaleY(.55)}}
.rover .p-book,.rover .p-phone,.rover .p-flash,.rover .carg{display:none}
.rover .w1{transform-origin:38px 166px}.rover .w2{transform-origin:124px 166px}
.rover .pageflip{transform-origin:80px 110px}
/* reading a book: both hands hold it, a page turns now and then */
.rover[data-act="read"] .p-book{display:inline}
.rover[data-act="read"] .upL{transform:rotate(-5deg)}.rover[data-act="read"] .foreL{transform:rotate(-69deg)}
.rover[data-act="read"] .upR{transform:rotate(5deg)}.rover[data-act="read"] .foreR{transform:rotate(69deg)}
.rover[data-act="read"] .pageflip{animation:turn 3.4s ease-in-out infinite}
@keyframes turn{0%,70%{transform:scaleX(1)}85%{transform:scaleX(-1)}100%{transform:scaleX(1)}}
.rover[data-act="read"] .fig{animation:nodRead 3.4s ease-in-out infinite}
@keyframes nodRead{0%,100%{transform:rotate(2deg)}50%{transform:rotate(4deg)}}
/* scrolling on his phone */
.rover[data-act="phone"] .p-phone{display:inline}
.rover[data-act="phone"] .upR{transform:rotate(13deg)}.rover[data-act="phone"] .foreR{transform:rotate(84deg)}
.rover[data-act="phone"] .fig{animation:nodRead 2s ease-in-out infinite}
/* selfie: phone held out, peace sign, flash */
.rover[data-act="selfie"] .p-phone,.rover[data-act="selfie"] .p-flash{display:inline}
.rover[data-act="selfie"] .upR{transform:rotate(-126deg)}.rover[data-act="selfie"] .foreR{transform:rotate(-20deg)}
.rover[data-act="selfie"] .upL{transform:rotate(150deg)}
.rover[data-act="selfie"] .foreL{animation:wv .5s ease-in-out infinite alternate}
.rover[data-act="selfie"] .fig{animation:tilt 1.4s ease-in-out infinite alternate}
.rover[data-act="selfie"] .p-flash{animation:snap 1.8s infinite}
@keyframes snap{0%,80%{opacity:0}86%{opacity:.95}100%{opacity:0}}
/* driving a car */
.rover[data-act="drive"] .carg,.rover[data-act="drive"] .sg{display:inline}
.rover[data-act="drive"] .upL{transform:rotate(-19deg)}.rover[data-act="drive"] .foreL{transform:rotate(-61deg)}
.rover[data-act="drive"] .upR{transform:rotate(19deg)}.rover[data-act="drive"] .foreR{transform:rotate(61deg)}
.rover[data-act="drive"] .fig{animation:none}
.rover[data-act="drive"] .thL,.rover[data-act="drive"] .thR{display:none}
.rover[data-act="drive"] .wheel{animation:spin .25s linear infinite}
.rover[data-act="drive"] .carbody{animation:carb .2s ease-in-out infinite alternate}
@keyframes carb{to{transform:translateY(-2px)}}
/* kicking a real ball */
.rover[data-act="kick"] .thR{animation:kickOnce .35s ease-out both}
.rover[data-act="kick"] .shR{animation:kickShin .35s ease-out both}
.rover[data-act="kick"] .upL{transform:rotate(45deg)}.rover[data-act="kick"] .upR{transform:rotate(-45deg)}
@keyframes kickOnce{0%{transform:rotate(30deg)}45%{transform:rotate(-65deg)}100%{transform:rotate(0)}}
@keyframes kickShin{0%{transform:rotate(60deg)}45%{transform:rotate(4deg)}100%{transform:rotate(8deg)}}
/* frisbee: throw, then catch with both hands */
.rover[data-act="frisbee"] .upR{animation:thr 2.6s ease-in-out infinite}
.rover[data-act="frisbee"] .foreR{transform:rotate(-20deg)}
.rover[data-act="frisbee"] .upL{animation:catchL 2.6s ease-in-out infinite}
@keyframes thr{0%{transform:rotate(48deg)}10%{transform:rotate(-80deg)}24%,70%{transform:rotate(-22deg)}82%,90%{transform:rotate(-82deg)}100%{transform:rotate(48deg)}}
@keyframes catchL{0%,70%{transform:rotate(0)}82%,90%{transform:rotate(-80deg)}100%{transform:rotate(0)}}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

      empty:"আগে একটি মেসেজ পেস্ট করুন।",fail:"ScamShield সার্ভারের সঙ্গে যোগাযোগ করা যাচ্ছে না। সার্ভার চালু আছে তো?",

      risk:"প্রতারণার ঝুঁকি",marked:"আপনার মেসেজে সাইবার যা লক্ষ করেছে",lg_hot:"প্রতারণার দিকে টানে",lg_cool:"নিরাপদের দিকে টানে",
      links:"মেসেজের লিংক",nolinks:"কোনো লিংক পাওয়া যায়নি।",why:"মডেল কতটা নিশ্চিত?",
      novoice:"এই ডিভাইসে বাংলা ভয়েস নেই। Microsoft Edge বা Chrome ব্যবহার করুন।",
      tips:["OTP বা PIN কাউকে বলবেন না, বিকাশের লোক বললেও না।","আসল কোম্পানি অ্যাকাউন্ট চালু রাখতে লিংকে ক্লিক করতে বলে না।","যে প্রতিযোগিতায় নামেননি, তার পুরস্কার? এটা ফাঁদ।","তাড়াহুড়ো আর ভয় দেখানো? থামুন। প্রতারকরা ইচ্ছা করেই তাড়া দেয়।"],
      foot:"ScamShield একটি সহায়ক, নিশ্চয়তা নয়। দুই দিকেই ভুল হতে পারে। টাকা বা পাসওয়ার্ডের ব্যাপার হলে অফিসিয়াল অ্যাপ বা হটলাইনে নিশ্চিত হয়ে নিন। চালু থাকলে লিংক যাচাইয়ে Google Safe Browsing ব্যবহার হয়; পরামর্শ সরবরাহ করেছে Google।",

  bnl:{hero:"Ajib message peyechen? Cyber ke jiggesh korun.",sub:"SMS, WhatsApp ba email-er lekha paste korun. Cyber bolbe eta scam, ad naki normal message, ar ekhon ki korben.",

      v:{suspicious:"Scam moune hocche",careful:"Savdhan thakun","not sure":"Cyber nishchit noy",legit:"Normal moune hocche",promo:"Ad moune hocche"},
      risk:"Scam-er jhunki",marked:"Apnar message e Cyber ja lokkho korechhe",lg_hot:"scam-er dike tane",lg_cool:"nirapod-er dike tane",
      links:"Message-er link",nolinks:"Kono link paoa jayni.",why:"Model koto ta nishchit?",

      foot:"ScamShield ekta sahayok, guarantee noy. Duidik e bhul hote pare. Taka ba password-er byapar hole official app ba hotline e confirm korun. Chalu thakle link check e Google Safe Browsing use hoy; advisory provided by Google.",
      ex:["Apnar bKash account bondho hoye jabe. Ekhoni verify korun: http://bkash-help.com/verify","Ei weekend e Daraz e sob juta te 20% discount!","Apnar OTP 482913. Kauke bolben na."]}
};
/* verdict -> colours (two for the gradient), mood for Cyber's face, icon in the stamp */
const WARN='<path d="M12 3 2 21h20zM12 10v5M12 18v.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
const VERDICT = {
  suspicious:{c:"#E5383B",c2:"#FF6A3D",light:false,mood:"alarm",icon:WARN},
  careful:{c:"#F5A300",c2:"#FFD23F",light:true,mood:"worry",icon:WARN},
  legit:{c:"#13A25A",c2:"#2BD9A0",light:false,mood:"happy",confetti:["#2BD9A0","#13A25A","#FFC93C","#19D3F3","#fff"],icon:'<path d="m4 12 5 5L20 6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'},
  promo:{c:"#0098C4",c2:"#7A4DFF",light:false,mood:"happy",confetti:["#19D3F3","#FF4FA3","#FFC93C","#4B3DFF","#fff"],icon:'<path d="M3 10v4h4l7 4V6L7 10zM17 9a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'},
  "not sure":{c:"#6B6F99",c2:"#9A8CFF",light:false,mood:"hmm",icon:'<path d="M9 9a3 3 0 1 1 4 2.8c-.7.4-1 .9-1 1.7M12 18v.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>'}
};
/* Cyber the robot. Face parts: .pupils moves with the cursor, .dart wiggles while scanning, .blink closes the eyes.
   Only one mouth is visible at a time, chosen by data-mood in the CSS. This markup is a constant, never user text. */
const MASCOT='<svg class="mascot" data-mood="idle" viewBox="0 0 200 220" aria-hidden="true">'+
 '<path class="shell" d="M100 8 180 38v68c0 56-36 92-80 106C56 198 20 162 20 106V38z" stroke="#15173F" stroke-width="7" stroke-linejoin="round"/>'+
 '<rect x="48" y="62" width="104" height="72" rx="22" fill="#fff" stroke="#15173F" stroke-width="6"/>'+
 '<g class="pupils"><g class="dart"><g class="blink"><circle cx="78" cy="98" r="11" fill="#15173F"/><circle cx="122" cy="98" r="11" fill="#15173F"/><circle cx="82" cy="94" r="3.5" fill="#fff"/><circle cx="126" cy="94" r="3.5" fill="#fff"/></g></g></g>'+
 '<path d="M100 62V44" stroke="#15173F" stroke-width="6" stroke-linecap="round"/><circle class="bulb" cx="100" cy="40" r="9" stroke="#15173F" stroke-width="5"/>'+
 '<path class="m m-idle" d="M84 156h32" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none"/>'+
 '<path class="m m-happy" d="M76 150q24 26 48 0" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none"/>'+
 '<path class="m m-alarm" d="M86 168q14-26 28 0z" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>'+
 '<path class="m m-worry" d="M78 164q22-18 44 0" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none"/>'+
 '<path class="m m-hmm" d="M80 160h40" stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none"/></svg>';

/* ============ 2. Helpers ============ */
const $ = id => document.getElementById(id);
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;   // true if the person asked for less motion
const sleep = ms => new Promise(r => setTimeout(r, ms));
/* el() builds elements with textContent, never innerHTML, so text from a scam message or the server cannot run as code. */
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})) if (v!==null) k==="class" ? n.className=v : n.setAttribute(k,v);
  for (const k of kids) n.append(k);
  return n;
}
let lang="en", last=null, runId=0;
const t = () => UI[lang];

/* ============ 3. Cyber's moods and eyes ============ */
function setMood(mood){ document.querySelectorAll(".mascot:not(.rover)").forEach(m=>m.dataset.mood=mood); }
function actOut(){ if(RM) return; document.querySelectorAll(".mascot:not(.rover)").forEach(m=>{m.classList.remove("act");void m.getBoundingClientRect();m.classList.add("act");}); }
// pupils follow the pointer: work out the direction from the robot's face to the cursor, move up to 7 units that way
addEventListener("pointermove", e=>{
  if(RM) return;
  document.querySelectorAll(".mascot").forEach(m=>{
    const r=m.getBoundingClientRect(), dx=e.clientX-(r.left+r.width/2), dy=e.clientY-(r.top+r.height*.45);
    const d=Math.hypot(dx,dy)||1, k=Math.min(7,d/25);
    m.querySelector(".pupils").setAttribute("transform",`translate(${dx/d*k} ${dy/d*k})`);
  });
});
let tipIndex=-1;
function nextTip(){
  const tips=t().tips; tipIndex=(tipIndex+1)%tips.length;
  const box=$("tip"); box.textContent=tips[tipIndex]; box.classList.remove("pop"); void box.offsetWidth; box.classList.add("pop");
}
$("heroCyber").innerHTML=MASCOT;
$("heroCyber").setAttribute("aria-label","Cyber. Tap for a safety tip.");
$("heroCyber").onclick=()=>{ nextTip(); setMood("happy"); actOut(); setTimeout(()=>setMood(last?VERDICT[last.verdict]?.mood||"hmm":"idle"),1200); };

/* ============ 4. Static text ============ */
function applyLang(){
  const u=t();
  document.documentElement.lang = lang==="bn" ? "bn" : "en";
  $("t-hero").textContent=u.hero; $("t-sub").textContent=u.sub; $("t-label").textContent=u.label;
  $("msg").placeholder=u.ph; $("t-deep").textContent=u.deep; $("go").textContent=u.check;
  $("clear").textContent=u.clear; $("t-foot").textContent=u.foot; $("t-try").textContent=u.tryit;
  document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.l===lang));
  const chips=$("chips"); chips.querySelectorAll(".chip").forEach(c=>c.remove());
  u.ex.forEach((text,i)=>{ const b=el("button",{class:"chip",type:"button"},["A","B","C"][i]+": "+text.slice(0,26)+"..."); b.onclick=()=>{$("msg").value=text;$("msg").focus();}; chips.append(b); });
  tipIndex=-1; nextTip(); labelRoam();
  if(last) check();
}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{lang=b.dataset.l; applyLang();});
$("clear").onclick=()=>{ $("msg").value=""; $("result").replaceChildren(); last=null; runId++; document.body.classList.remove("has-verdict"); setMood("idle"); window.speechSynthesis&&speechSynthesis.cancel(); rover.release(); };

/* ============ 5. Ask the API (with a short "scanning" show) ============ */
async function check(ev){
  if(ev) ev.preventDefault();
  const text=$("msg").value.trim(), err=$("err"); err.textContent="";
  if(!text){err.textContent=t().empty;return;}
  const go=$("go"), field=$("field"), my=++runId;
  go.disabled=true; go.textContent=t().checking;
  field.style.setProperty("--h",($("msg").offsetHeight-56)+"px"); field.classList.add("scanning");
  setMood("scan"); rover.hold("search");
  try{
    // wait for BOTH the server and a minimum scan time, so the animation is seen even when the answer is instant
    const [r] = await Promise.all([
      fetch("/check",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,look_deeper:$("deep").checked,lang})}),
      sleep(RM?0:1300)
    ]);
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.detail||r.statusText);}
    const data=await r.json();
    if(my!==runId) return;
    last=data; last._text=text; render(data,text,my);
  }catch(e){
    setMood("idle"); rover.release();
    err.textContent = e instanceof TypeError ? t().fail : String(e.message||e);
  }finally{ field.classList.remove("scanning"); go.disabled=false; go.textContent=t().check; }
}
$("form").addEventListener("submit",check);

/* ============ 6. Effects ============ */
function confetti(colors){
  if(RM) return;
  const c=$("fx"), x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const ps=Array.from({length:120},()=>({x:innerWidth/2+(Math.random()-.5)*240,y:innerHeight*.4,vx:(Math.random()-.5)*15,vy:-Math.random()*14-4,s:7+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:colors[Math.random()*colors.length|0]}));
  let f=0;

/* Re-draws the message with risky words in red, safe-leaning words in green, and links coloured by their level.
   Words come from the engine's leave-one-word-out test (words_raising / words_lowering). */
function markedMessage(d,text,u){
  const norm=a=>new Set((a||[]).map(x=>String(Array.isArray(x)?x[0]:(x.word||x[0]||x)).normalize("NFC").toLowerCase()));
  const hot=norm(d.words_raising), cool=norm(d.words_lowering), links=d.links||[];
  const box=el("div",{class:"marked"});
  text.split(/(\s+)/).forEach(tok=>{
    if(!tok.trim()){ box.append(tok); return; }
    const core=tok.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu,"").normalize("NFC").toLowerCase();
    const link=links.find(l=>tok.includes(l.url)||l.url.includes(core)&&core.length>6);
    if(link) box.append(el("mark",{class:link.level||"check"},tok));
    else if(hot.has(core)) box.append(el("mark",{class:"hot"},tok));
    else if(cool.has(core)) box.append(el("mark",{class:"cool"},tok));
    else box.append(tok);
  });
  const det=el("details",{open:""},el("summary",{},u.marked),box,
    el("div",{class:"legend"},"🟥 "+u.lg_hot+"   🟩 "+u.lg_cool));
  return det;
}

        }else if(now>until) next();
      }
      if(fd) frisbeeStep(now);
      wrap.style.transform=`translate(${x}px,${y}px)`; flip.style.transform=`scaleX(${dir})`;
    }
    requestAnimationFrame(frame);
  }
  // an activity is over: sometimes drive to the other side, otherwise just walk somewhere else
  function next(){ endActivity(); layout(); if(both&&Math.random()<.35) startTrip(); else wander(); }
  function onScreen(){ layout(); x=clamp(x,zone.x0,zone.x1); y=clamp(y,zone.y0,zone.y1); }   // if he is off-screen (walking in, or mid car trip), bring him back before he reacts
  function hold(a){ clearTimeout(timer); endActivity(); onScreen(); held={}; set(a); }
  function release(){ clearTimeout(timer); held=null; endActivity(); layout(); wander(); }
  function react(key){
    if(!on) return; clearTimeout(timer); endActivity(); onScreen();
    const plan={suspicious:["alert",5200,true],careful:["careful",3800],legit:["cheer",4200],promo:["cheer",4200],"not sure":["shrug",3000]}[key]||["shrug",3000];
    if(plan[2]&&!strip){            // run to the empty space next to the verdict card, so the alarm is seen right there
      const card=document.querySelector(".verdict"), cr=card?card.getBoundingClientRect():null;
      const gy=cr?clamp(cr.top+cr.height/2-H()/2,zone.y0,zone.y1):zone.y0;
      held={goto:{x:(zone.x0+zone.x1)/2,y:gy},then:plan}; set("run");
    }else{ held={}; set(plan[0]); timer=setTimeout(release,plan[1]); }
  }
  svg.addEventListener("click",()=>{                         // poke him and he jumps
    jumper.classList.remove("jump"); void jumper.offsetWidth; jumper.classList.add("jump");
    sayNow("😄"); setTimeout(()=>{ sayNow(SAY[act]); },900);
  });
  const btn=$("roamBtn");
  btn.setAttribute("aria-pressed",on); wrap.hidden=!on;
  btn.onclick=()=>{ on=!on; btn.setAttribute("aria-pressed",on); wrap.hidden=!on; if(!on) stopToys(); try{localStorage.setItem("roam",on?"on":"off");}catch(e){} };
  addEventListener("resize",()=>{ layout(); y=clamp(y,zone.y0,zone.y1); if(!trip) x=clamp(x,zone.x0-200,zone.x1+200); });
  layout();
  x=side==="L"?-W()-20:innerWidth+20; y=rand(zone.y0,zone.y1); tx=rand(zone.x0,zone.x1); ty=rand(zone.y0,zone.y1); dir=tx>=x?1:-1; set("walk");
  requestAnimationFrame(frame);
  window.__cyber={hold,release,react,go:n=>{clearTimeout(timer);held=null;endActivity();layout();startActivity(n);},trip:()=>{held=null;endActivity();layout();startTrip();},state:()=>({x,y,side,act,ball:fb&&{bx:fb.bx,bh:fb.bh}})};
  return {hold,release,react};
})();

applyLang();
</script>
